name: binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - ".github/workflows/autobot.yml"
      - "AutoBot.yml"
      - "scripts/autobot.py"
  workflow_dispatch:
  # Fork synchronization can update main without starting a push workflow.
  # This lightweight poller catches such commits and the normal push trigger
  # remains the fast path.
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

# Every publisher (push, tag, manual and retry) shares this lock through Latest
# reconciliation. Additional release workflows must use the same group.
concurrency:
  group: binaries-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      needs_publish: ${{ steps.release-state.outputs.needs_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        # GITHUB_TOKEN tag pushes do not trigger another workflow; publish below.
        run: python3 scripts/release-version.py
      - name: Check whether this commit needs a package
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh release view "v${{ steps.version.outputs.version }}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$state" = false ]; then
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} is already published; scheduled check will skip builds."
          else
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          python3 tests/test-release-version.py
          python3 tests/test-release-latest.py
          python3 -m unittest discover -s scripts/docker-updater -p 'test_*.py'
          go test ./...

      - name: Build Windows and Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          pack() {
            dir="dist/$1-$2"
            mkdir -p "$dir"
            cp "$3" "$dir/"
            cp config.example.json README.md "$dir/"
            python3 - "$dir" "dist/wb2api-panel-${VERSION}-$1-$2.zip" <<'PY'
          import pathlib, sys, zipfile

          directory = pathlib.Path(sys.argv[1])
          archive = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as z:
              for path in directory.iterdir():
                  z.write(path, path.name)
          PY
          }

          for os_name in windows linux; do
            bin=wb2api
            [ "$os_name" = windows ] && bin=wb2api.exe
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os_name" GOARCH="$arch" \
                go build -trimpath -ldflags="-s -w -X main.appVersion=${VERSION}" \
                -o "$bin" ./cmd/server
              pack "$os_name" "$arch" "$bin"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ env.VERSION }}-windows-amd64
          path: |
            dist/windows-amd64
            dist/wb2api-panel-${{ env.VERSION }}-windows-amd64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ env.VERSION }}-windows-arm64
          path: |
            dist/windows-arm64
            dist/wb2api-panel-${{ env.VERSION }}-windows-arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ env.VERSION }}-linux-amd64
          path: |
            dist/linux-amd64
            dist/wb2api-panel-${{ env.VERSION }}-linux-amd64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ env.VERSION }}-linux-arm64
          path: |
            dist/linux-arm64
            dist/wb2api-panel-${{ env.VERSION }}-linux-arm64.zip
          if-no-files-found: error

  build-macos:
    needs: version
    if: needs.version.outputs.needs_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build macOS app bundles and DMGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          arch="${{ matrix.arch }}"
          dir="dist/darwin-${arch}"
          app="$dir/WorkBuddy2API.app"
          bash scripts/macos/build-app.sh "$arch" "$app"
          bash scripts/macos/test-updater.sh "$app"
          python3 scripts/macos/package-update.py "$app" \
            "dist/wb2api-panel-${VERSION}-darwin-${arch}-update.zip"
          # Include the upstream standalone macOS binary alongside the app.
          cp "$app/Contents/Resources/wb2api" "$dir/wb2api"
          cp config.example.json README.md "$dir/"

          python3 - "$dir" "dist/wb2api-panel-${VERSION}-darwin-${arch}.zip" <<'PY'
          import pathlib, sys, zipfile

          directory = pathlib.Path(sys.argv[1])
          archive = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as z:
              for path in directory.rglob("*"):
                  if path.is_file():
                      z.write(path, pathlib.Path(directory.name) / path.relative_to(directory))
          PY

          stage="$(mktemp -d)"
          cp -R "$app" "$stage/WorkBuddy2API.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -quiet -volname WorkBuddy2API -srcfolder "$stage" \
            -ov -format UDZO "dist/wb2api-panel-${VERSION}-darwin-${arch}.dmg"
          rm -rf "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ env.VERSION }}-darwin-${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  build-windows-installers:
    needs: version
    if: needs.version.outputs.needs_publish == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          pattern: wb2api-panel-${{ needs.version.outputs.version }}-windows-*
          path: release-assets
          merge-multiple: false
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build per-user installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $template = Join-Path $PWD 'scripts\windows\WorkBuddy2API.iss'
          foreach ($arch in @('amd64', 'arm64')) {
            # download-artifact may flatten or preserve the artifact directory;
            # identify the executable by its architecture path instead.
            $binary = Get-ChildItem (Join-Path $PWD 'release-assets') -Filter 'wb2api.exe' -File -Recurse |
              Where-Object { $_.FullName -match "windows-$arch|$arch" } |
              Select-Object -First 1
            if (-not $binary) { throw "Windows $arch wb2api.exe not found under release-assets" }
            $inputDir = $binary.Directory.FullName
            & $iscc "/DAppVersion=$env:VERSION" "/DInputDir=$inputDir" "/DOutputDir=$PWD\dist" "/DOutputName=WorkBuddy2API-Setup-windows-$arch" $template
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $arch" }
          }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ env.VERSION }}-windows-installers
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.version.outputs.needs_publish == 'true'
    needs: [version, build, build-macos, build-windows-installers]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/macos/update-manifest.py "$VERSION" release-assets
          mapfile -t files < <(find release-assets -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*Setup-windows-*.exe' \) -print | sort)
          [ "${#files[@]}" -eq 12 ]
          state="$(gh release view "v${VERSION}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$state" = false ]; then
            echo "v${VERSION} is already published; leaving its assets unchanged."
            # Resume a failed post-publication reconciliation without re-uploading.
            python3 scripts/release-latest.py "$VERSION"
            exit 0
          fi
          if [ "$state" != true ]; then
            gh release create "v${VERSION}" --title "v${VERSION}" \
              --generate-notes --draft --verify-tag
          fi
          # A failed upload can be retried against the existing draft.
          gh release upload "v${VERSION}" "${files[@]}" release-assets/macos-update.json release-assets/update.json --clobber
          # Publish without promotion, then reconcile and verify the highest
          # published timestamp while still holding binaries-release.
          python3 scripts/release-latest.py "$VERSION"
